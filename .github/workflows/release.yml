name: Release a new version

on:
  push:
    tags:
      - "v*"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate semantic version tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Validate tag format
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [[ ! "$tag" =~ $semver ]]; then
            echo "Tag '$tag' is not a valid semantic version tag"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: twoup_linux_amd64.tar.gz
          - goos: linux
            goarch: arm64
            archive: twoup_linux_arm64.tar.gz
          - goos: darwin
            goarch: amd64
            archive: twoup_darwin_amd64.tar.gz
          - goos: darwin
            goarch: arm64
            archive: twoup_darwin_arm64.tar.gz
          - goos: windows
            goarch: amd64
            archive: twoup_windows_amd64.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false

      - name: Build executable
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          binary="twoup"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            binary="twoup.exe"
          fi

          GOOS="${{ matrix.goos }}" \
          GOARCH="${{ matrix.goarch }}" \
          CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o "dist/${binary}" ./cmd/twoup

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            (cd dist && zip -9 "${{ matrix.archive }}" "${binary}")
          else
            (cd dist && tar -czf "${{ matrix.archive }}" "${binary}")
          fi

      - name: Attest release asset
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ matrix.archive }}

      - name: Stage attestation bundle
        shell: bash
        run: |
          set -euo pipefail

          cp "${STEPS_ATTEST_OUTPUTS_BUNDLE_PATH}" "dist/${{ matrix.archive }}.attestation.json"
        env:
          STEPS_ATTEST_OUTPUTS_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

      - name: Upload attestation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}.attestation
          path: dist/${{ matrix.archive }}.attestation.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [validate-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: twoup_*
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: dist
          format: spdx-json
          output-file: dist/twoup-${{ needs.validate-tag.outputs.tag }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest SBOM
        id: attest-sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/twoup_*.tar.gz
            dist/twoup_*.zip
          sbom-path: dist/twoup-${{ needs.validate-tag.outputs.tag }}.spdx.json

      - name: Stage SBOM attestation bundle
        shell: bash
        run: |
          set -euo pipefail

          cp "${STEPS_ATTEST_SBOM_OUTPUTS_BUNDLE_PATH}" "dist/twoup-${NEEDS_VALIDATE_TAG_OUTPUTS_TAG}.spdx.json.attestation.json"
        env:
          STEPS_ATTEST_SBOM_OUTPUTS_BUNDLE_PATH: ${{ steps.attest-sbom.outputs.bundle-path }}
          NEEDS_VALIDATE_TAG_OUTPUTS_TAG: ${{ needs.validate-tag.outputs.tag }}

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd dist
            sha256sum ./* > checksums.txt
          )

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          assets=(dist/*)

          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release '$tag' already exists; releases are immutable"
            exit 1
          fi

          gh release create "$tag" "${assets[@]}" \
            --title "$tag" \
            --generate-notes \
            --verify-tag
